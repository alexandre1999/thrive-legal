<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f3efe9; --card: #fbf9f6; --ink: #211f1c; --ink-soft: #6d675f; --ink-faint: #a49d94;
      --line: #e4ded4; --clay: #a75a3f; --clay-wash: #f0e5df; --slate: #40595f;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #171614; --card: #1f1d1b; --ink: #f1ece5; --ink-soft: #b9b1a7; --ink-faint: #81796f;
        --line: #33302c; --clay: #d08566; --clay-wash: #2c211c; --slate: #8fb0b6;
      }
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.7 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .wrap { max-width: 720px; margin: 0 auto; padding: 0 20px; }
    header { padding: 28px 0 8px; }
    .brand { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; color: var(--ink); }
    .badge {
      width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
      background: linear-gradient(135deg, var(--clay), var(--slate)); color: #fff;
      font: 600 20px/1 Fraunces, Georgia, serif;
    }
    .brand span { font: 600 20px/1 Fraunces, Georgia, serif; }
    nav { display: flex; flex-wrap: wrap; gap: 6px; margin: 20px 0 0; }
    nav a {
      text-decoration: none; color: var(--ink-soft); font-size: 14px; font-weight: 500;
      padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    }
    nav a:hover { color: var(--ink); border-color: var(--ink-faint); }
    nav a.on { background: var(--clay); border-color: var(--clay); color: #fff; }
    main {
      background: var(--card); border: 1px solid var(--line); border-radius: 18px;
      padding: 28px 24px 32px; margin: 24px 0 16px;
    }
    @media (min-width: 640px) { main { padding: 44px 52px 48px; } }
    h1 { font: 600 clamp(30px, 6vw, 40px)/1.15 Fraunces, Georgia, serif; margin: 0 0 6px; letter-spacing: -0.01em; }
    h2 { font: 600 22px/1.3 Fraunces, Georgia, serif; margin: 36px 0 8px; }
    p, li { color: var(--ink); }
    p > em:only-child { color: var(--ink-faint); font-style: normal; font-size: 14px; }
    a { color: var(--clay); }
    strong { font-weight: 600; }
    ul { padding-left: 20px; }
    .home li { margin: 6px 0; font-size: 17px; }
    footer { color: var(--ink-faint); font-size: 13px; padding: 8px 0 40px; }
    footer a { color: var(--ink-soft); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="{{ '/' | relative_url }}"><div class="badge">T</div><span>Thrive</span></a>
      <nav>
        <a href="{{ '/privacy/' | relative_url }}"{% if page.url == '/privacy/' %} class="on"{% endif %}>Privacy</a>
        <a href="{{ '/terms/' | relative_url }}"{% if page.url == '/terms/' %} class="on"{% endif %}>Terms</a>
        <a href="{{ '/safety/' | relative_url }}"{% if page.url == '/safety/' %} class="on"{% endif %}>Safety</a>
        <a href="{{ '/delete-account/' | relative_url }}"{% if page.url == '/delete-account/' %} class="on"{% endif %}>Delete account</a>
      </nav>
    </header>
    <main{% if page.url == '/' %} class="home"{% endif %}>
      <h1>{{ page.title }}</h1>
      {{ content }}
    </main>
    <footer>Thrive is made by Dineri (Alexandre Martins) · <a href="mailto:management@dineri.info">management@dineri.info</a></footer>
  </div>
</body>
</html>
